    href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css"

  >

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: #f8fafc;
    }

    header {
      padding: 16px;
      background: #172337;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 { margin: 0; font-size: 25px; }
    header p { margin: 4px 0 0; color: #9caec4; font-size: 12px; }

    .status {
      color: #4ade80;
      font-size: 12px;
    }

    main { padding: 16px; }

    #login {
      max-width: 420px;
      margin: 45px auto;
      padding: 22px;
      background: #172337;
      border-radius: 14px;
    }

    #login h2 { margin-top: 0; }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #475569;
      border-radius: 8px;
      background: #243449;
      color: white;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 13px 16px;
      background: #2563eb;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary { background: #334155; }

    #login button { width: 100%; margin-top: 10px; }

    #loginMessage {
      color: #fca5a5;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    #workspace { display: none; }

    #map {
      height: 68vh;
      min-height: 350px;
      width: 100%;
      border-radius: 13px;
      overflow: hidden;
      background: #243449;
    }

    .map-actions {
      display: flex;
      gap: 10px;
      margin: 12px 0;
      flex-wrap: wrap;
    }

    #mapMessage {
      color: #cbd5e1;
      font-size: 13px;
      margin: 10px 0;
    }

    .customer-marker {
      width: 18px;
      height: 18px;
      border: 3px solid white;
      border-radius: 50%;
      background: #2563eb;
      box-shadow: 0 1px 6px #0008;
    }

    .maplibregl-popup-content {
      color: #172337;
      border-radius: 9px;
      font-size: 14px;

  <header>

  </header>

  <main>
    <section id="login">

      <form id="loginForm">
        <input
          id="email"
          type="email"
          placeholder="Correo electrónico"
          autocomplete="username"
          required
        >

          id="password"
          type="password"
          placeholder="Contraseña"
          autocomplete="current-password"
          required

        <button type="submit" id="loginButton">
          Entrar a Rumbo
        </button>
      </form>

      <p id="loginMessage"></p>
    </section>

    <section id="workspace">
      <div class="map-actions">
        <button id="gpsButton">Mi ubicación</button>
        <button id="logoutButton" class="secondary">Cerrar sesión</button>
      </div>

      <p id="mapMessage">Preparando el mapa...</p>

  <footer>Rumbo · Tu mapa de trabajo</footer>

  <!-- Libraries and project configuration -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="./config.js"></script>

  <script>
    const supabaseClient = window.supabase.createClient(
      window.RUMBO_CONFIG.supabaseUrl,
      window.RUMBO_CONFIG.supabaseKey
    );

    let map = null;
    let mapInitialized = false;
    let customerMarkers = [];

    const loginSection = document.getElementById("login");
    const workspace = document.getElementById("workspace");
    const loginMessage = document.getElementById("loginMessage");
    const mapMessage = document.getElementById("mapMessage");

    function showWorkspace() {
      loginSection.style.display = "none";
      workspace.style.display = "block";

      if (!mapInitialized) {
        initializeMap();
      } else {
        setTimeout(() => map.resize(), 100);
      }
    }

    function showLogin() {
      workspace.style.display = "none";
      loginSection.style.display = "block";
    }

    async function initializeMap() {
      mapInitialized = true;

      map = new maplibregl.Map({
        container: "map",
        style: {
          version: 8,
          sources: {
            osm: {
              type: "raster",
              tiles: [
                "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
              ],
              tileSize: 256,
              attribution: "© OpenStreetMap contributors"
            }
          },
          layers: [
            {
              id: "osm-layer",
              type: "raster",
              source: "osm"
            }
          ]
        },
        center: [-90.5069, 15.7835],
        zoom: 7
      });

      map.addControl(
        new maplibregl.NavigationControl(),
        "top-right"
      );

      map.on("load", loadCustomers);

      map.on("error", () => {
        mapMessage.textContent =
          "No se pudo cargar una parte del mapa. Revisa tu conexión.";
      });
    }

    async function loadCustomers() {
      mapMessage.textContent = "Cargando clientes...";

      const { data, error } = await supabaseClient
        .from("customers")
        .select(
          "id, full_name, latitude, longitude, customer_type, service_type, monthly_amount"
        );

      if (error) {
        mapMessage.textContent =
          "No se pudieron cargar los clientes: " + error.message;
        return;
      }

      customerMarkers.forEach(marker => marker.remove());
      customerMarkers = [];

      let validCount = 0;

      (data || []).forEach(customer => {
        const lat = Number(customer.latitude);
        const lon = Number(customer.longitude);

        if (
          !Number.isFinite(lat) ||
          !Number.isFinite(lon) ||
          lat < -90 || lat > 90 ||
          lon < -180 || lon > 180
        ) {
          return;
        }

        const markerElement = document.createElement("div");
        markerElement.className = "customer-marker";

        const popupContent = document.createElement("div");

        const name = document.createElement("strong");
        name.textContent = customer.full_name || "Cliente";
        popupContent.appendChild(name);

        const service = document.createElement("p");
        service.textContent =
          "Servicio: " + (customer.service_type || "No especificado");
        popupContent.appendChild(service);

        const type = document.createElement("p");
        type.textContent =
          "Tipo: " + (customer.customer_type || "No especificado");
        popupContent.appendChild(type);

        const popup = new maplibregl.Popup({ offset: 15 })
          .setDOMContent(popupContent);

        const marker = new maplibregl.Marker({
          element: markerElement
        })
          .setLngLat([lon, lat])
          .setPopup(popup)
          .addTo(map);

        customerMarkers.push(marker);
        validCount++;
      });

      mapMessage.textContent =
        validCount + " clientes cargados en el mapa.";
    }

    document.getElementById("loginForm").addEventListener(
      "submit",
      async event => {
        event.preventDefault();

        loginMessage.textContent = "Iniciando sesión...";

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const { error } = await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          loginMessage.textContent =
            "No se pudo iniciar sesión: " + error.message;
          return;
        }

        loginMessage.textContent = "";
        showWorkspace();
      }
    );

    document.getElementById("logoutButton").addEventListener(
      "click",
      async () => {
        await supabaseClient.auth.signOut();
        showLogin();
      }
    );

    document.getElementById("gpsButton").addEventListener(
      "click",
      () => {
        if (!navigator.geolocation) {
          mapMessage.textContent =
            "Este navegador no permite obtener la ubicación.";
          return;
        }

        mapMessage.textContent = "Buscando tu ubicación...";

        navigator.geolocation.getCurrentPosition(
          position => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            map.flyTo({
              center: [lon, lat],
              zoom: 16
            });

            mapMessage.textContent =
              "Tu ubicación: " + lat.toFixed(6) + ", " +
              lon.toFixed(6);
          },
          error => {
            mapMessage.textContent =
              "No se pudo obtener la ubicación. Revisa los permisos GPS.";
          },
          { enableHighAccuracy: true, timeout: 15000 }
        );
      }
    );

    async function checkSession() {
      const { data, error } = await supabaseClient.auth.getSession();

      if (error) {
        loginMessage.textContent = error.message;
        showLogin();
        return;
      }

      if (data.session) {
        showWorkspace();
      } else {
        showLogin();
      }
    }

    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === "SIGNED_OUT") {
        showLogin();
      }
    });

    checkSession();
  </script>

<script>
'use strict';

/* ======================================================
   CONNECTION
====================================================== */

const $ = id => document.getElementById(id);

const loginMessage = (message, type='') => {
  $('loginMsg').textContent = message;
  $('loginMsg').className = 'small ' + type;
};

if (
  !window.RUMBO_CONFIG ||
  !window.RUMBO_CONFIG.supabaseUrl ||
  !window.RUMBO_CONFIG.supabaseKey ||
  !window.supabase
) {
  loginMessage(
    'No se pudo cargar la conexión. Revisa config.js e inténtalo de nuevo.',
    'error'
  );

  throw new Error('Falta RUMBO_CONFIG o Supabase JS.');
}

const sb = window.supabase.createClient(
  window.RUMBO_CONFIG.supabaseUrl,
  window.RUMBO_CONFIG.supabaseKey
);


/* ======================================================
   APPLICATION STATE
====================================================== */

let map = null;
let markers = [];

let customers = [];
let visits = [];
let payments = [];
let reminders = [];

let profile = null;

let holdTimer = null;
let holdPoint = null;
let currentLocation = null;

let paidEmoji =
  localStorage.getItem('rumboPaidEmoji') || '💰';


/* ======================================================
   HELPERS
====================================================== */

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  })[char]);
}

function todayISO() {
  const d = new Date();

  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,'0'),
    String(d.getDate()).padStart(2,'0')
  ].join('-');
}

function monthStart() {
  return todayISO().slice(0,7) + '-01';
}

function dateOnly(value) {
  return value ? String(value).slice(0,10) : '';
}

function isAdmin() {
  return profile?.role === 'admin';
}

function showModal(html) {
  $('modalBody').innerHTML = html;
  $('modal').classList.remove('hidden');
}

function closeModal() {
  $('modal').classList.add('hidden');
}

$('closeModal').addEventListener('click',closeModal);


/* ======================================================
   NAVIGATION
====================================================== */

function openPage(page) {

  if (page === 'admin' && !isAdmin()) {
    return;
  }

  const pages = [
    'map',
    'customers',
    'visits',
    'payments',
    'reminders',
    'admin'
  ];

  pages.forEach(name => {
    $('page-'+name).classList.toggle(
      'hidden',
      name !== page
    );
  });

  document.querySelectorAll('.bottom button').forEach(button => {
    button.classList.toggle(
      'active',
      button.dataset.page === page
    );
  });

  if (page === 'map' && map) {
    setTimeout(() => map.resize(),100);
  }
}

document.querySelectorAll('.bottom button[data-page]')
  .forEach(button => {
    button.addEventListener('click',() => {
      openPage(button.dataset.page);
    });
  });


/* ======================================================
   LOGIN AND SESSION
====================================================== */

function setSignedIn(signedIn) {

  $('login').classList.toggle('hidden',signedIn);
  $('app').classList.toggle('hidden',!signedIn);
  $('nav').classList.toggle('hidden',!signedIn);

  if (signedIn) {
    openPage('map');

    setTimeout(() => {
      initMap();
    },100);
  }
}

async function signIn(event) {

  event.preventDefault();

  const email = $('email').value.trim();
  const password = $('password').value;

  const button = $('loginBtn');

  button.disabled = true;
  button.textContent = 'Ingresando…';

  loginMessage('');

  try {

    const {data,error} = await sb.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      throw error;
    }

    if (!data.user) {
      throw new Error('No se recibió una sesión válida.');
    }

    await enterApp(data.user);

  } catch (error) {

    loginMessage(
      error.message || 'No se pudo iniciar sesión.',
      'error'
    );

  } finally {

    button.disabled = false;
    button.textContent = 'Entrar';

  }
}

$('loginForm').addEventListener('submit',signIn);


async function enterApp(user) {

  try {

    const {data,error} = await sb
      .from('profiles')
      .select('*')
      .eq('id',user.id)
      .maybeSingle();

    if (error) {
      throw error;
    }

    profile = data || null;

    $('welcome').textContent =
      profile?.display_name ||
      user.email ||
      'Panel de trabajo';

    $('adminNav').classList.toggle(
      'hidden',
      !isAdmin()
    );

    $('paidEmoji').value = paidEmoji;

    setSignedIn(true);

    await loadAll();

  } catch (error) {

    loginMessage(
      'No se pudo cargar tu perfil: ' + error.message,
      'error'
    );

    await sb.auth.signOut();

    profile = null;

    setSignedIn(false);

  }
}


async function checkSession() {

  try {

    const {data,error} = await sb.auth.getSession();

    if (error) {
      throw error;
    }

    if (data.session?.user) {
      await enterApp(data.session.user);
    }

  } catch (error) {

    loginMessage(
      'Error al revisar la sesión: ' + error.message,
      'error'
    );

  }
}


$('logout').addEventListener('click',async () => {

  const {error} = await sb.auth.signOut();

  if (error) {
    alert('No se pudo cerrar sesión: ' + error.message);
    return;
  }

  profile = null;

  customers = [];
  visits = [];
  payments = [];
  reminders = [];

  clearMarkers();

  setSignedIn(false);

  loginMessage('Sesión cerrada.','success');

});


sb.auth.onAuthStateChange((event,session) => {

  if (event === 'SIGNED_OUT') {

    profile = null;

    setSignedIn(false);

  }

});


/* ======================================================
   INSTALLATION PAYMENT STATUS
====================================================== */

function firstDue(customer) {

  if (!customer.installation_date) {
    return null;
  }

  const installation = new Date(
    customer.installation_date + 'T12:00:00'
  );

  const year = installation.getFullYear();
  const month = installation.getMonth();

  if (installation.getDate() <= 15) {

    return new Date(year,month+1,1);

  }

  return new Date(year,month+2,1);

}


function customerStatus(customer) {

  const due = firstDue(customer);

  if (due) {

    const today = new Date();

    if (today >= due) {

      return {
        text:'Primera mensualidad pendiente',
        emoji:'🔴',
        cls:'red'
      };

    }

    return {
      text:'Primera mensualidad aún no vence',
      emoji:'🔵',
      cls:'blue'
    };

  }

  const paid = payments.some(payment => {

    return (
      payment.customer_id === customer.id &&
      dateOnly(payment.billing_month) === monthStart()
    );

  });

  if (paid) {

    return {
      text:'Pagado este mes',
      emoji:paidEmoji,
      cls:'green'
    };

  }

  const visited = visits.some(visit => {

    const visitDate = dateOnly(
      visit.visited_at || visit.created_at
    );

    return (
      visit.customer_id === customer.id &&
      visitDate >= monthStart()
    );

  });

  if (visited) {

    return {
      text:'Visitado, falta pago',
      emoji:'⭐',
      cls:'yellow'
    };

  }

  return {
    text:'Sin visita este mes',
    emoji:'📍',
    cls:'blue'
  };

}


function markerColor(customer) {

  const status = customerStatus(customer);

  if (status.cls === 'red') return '#ff5964';
  if (status.cls === 'green') return '#21c58b';
  if (status.cls === 'yellow') return '#ffbf47';

  if (firstDue(customer)) return '#2684ff';

  return '#39d5e8';

}


/* ======================================================
   LOAD DATABASE DATA
====================================================== */

async function loadAll() {

  $('mapCount').textContent = 'Cargando…';

  const results = await Promise.all([

    sb.from('customers')
      .select('*')
      .order('created_at',{ascending:false}),

    sb.from('visits')
      .select('*')
      .order('created_at',{ascending:false})
      .limit(200),

    sb.from('payments')
      .select('*')
      .order('created_at',{ascending:false})
      .limit(200),

    sb.from('reminders')
      .select('*')
      .order('created_at',{ascending:false})
      .limit(200)

  ]);

  const customerResult = results[0];

  if (customerResult.error) {
    throw customerResult.error;
  }

  customers = customerResult.data || [];

  visits = results[1].error ? [] : (results[1].data || []);
  payments = results[2].error ? [] : (results[2].data || []);
  reminders = results[3].error ? [] : (results[3].data || []);

  $('nCustomers').textContent = customers.length;

  $('nVisits').textContent = visits.filter(visit => {

    return dateOnly(
      visit.visited_at || visit.created_at
    ) >= monthStart();

  }).length;

  $('nPaid').textContent = payments.filter(payment => {

    return dateOnly(payment.billing_month) === monthStart();

  }).length;

  $('nDue').textContent = customers.filter(customer => {

    const status = customerStatus(customer);

    return (
      status.cls === 'red' ||
      status.cls === 'yellow'
    );

  }).length;

  renderMarkers();
  renderCustomers();
  renderReadOnlyLists();

  $('mapCount').textContent =
    customers.length + ' clientes';

}

  let month = installation.getMonth();

  // Del 1 al 15: primer pago el siguiente mes.
  // Del 16 al final: primer pago el mes posterior.
  if (installation.getDate() > 15) month++;

  return new Date(year, month + 1, 1);
}

/* -------------------------------------------------------
   ESTADOS DE CLIENTES Y MENSUALIDADES
------------------------------------------------------- */

function firstDue(customer) {
  if (!customer.installation_date) return null;

  const installation = new Date(customer.installation_date + 'T12:00:00');
  let year = installation.getFullYear();
  let month = installation.getMonth();

  // Del 1 al 15: primer pago el siguiente mes.
  // Del 16 al final: primer pago el mes posterior.
  if (installation.getDate() > 15) month++;

  return new Date(year, month + 1, 1);
}

function customerStatus(customer) {
  const due = firstDue(customer);
  const today = new Date();

  if (due && today >= due) {
    return {
      text:'Primera mensualidad pendiente',
      emoji:'🔴',
      cls:'red'
    };
  }

  if (due) {
    return {
      text:'Primera mensualidad aún no vence',
      emoji:'🔵',
      cls:'blue'
    };
  }

  const paid = payments.some(payment =>
    payment.customer_id === customer.id &&
    dateOnly(payment.billing_month) === monthStart()
  );

  if (paid) {
    return {
      text:'Pagado este mes',
      emoji:paidEmoji,
      cls:'green'
    };
  }

  const visited = visits.some(visit =>
    visit.customer_id === customer.id &&
    dateOnly(visit.visited_at || visit.created_at) >= monthStart()
  );

  if (visited) {
    return {
      text:'Visitado, falta pago',
      emoji:'⭐',
      cls:'yellow'
    };
  }

  return {
    text:'Sin visita este mes',
    emoji:'📍',
    cls:'blue'
  };
}

function markerColor(customer) {
  const status = customerStatus(customer);

  if (status.cls === 'red') return '#ff5964';
  if (status.cls === 'green') return '#21c58b';
  if (status.cls === 'yellow') return '#ffbf47';
  if (firstDue(customer)) return '#2684ff';

  return '#9bb2ca';
}
